name: Deploy inflation-sim to GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/inflation-year-over-year-sim-b403
    paths:
      - "inflation-sim/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inflation-sim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inflation-sim/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: inflation-sim/dist
          force_orphan: true
